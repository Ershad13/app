// apply plugin: 'com.android.application' // Applied via plugins block in project root for AGP 7.0+
plugins {
    id 'com.android.application'
}

android {
    compileSdkVersion 33 // Updated for JDK 17 and modern Android
    namespace "com.example.androidthings.myproject" // Required for AGP 7.0+

    defaultConfig {
        applicationId "com.example.androidthings.myproject" // Consider changing this for a new app
        minSdkVersion 21
        targetSdkVersion 33 // Updated
        versionCode 1
        versionName "1.0"
        // vectorDrawables.useSupportLibrary = true // Recommended for AndroidX
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17 // Updated to Java 17
        targetCompatibility JavaVersion.VERSION_17 // Updated to Java 17
    }
    // For Kotlin projects, you would also add:
    // kotlinOptions {
    // jvmTarget = '17'
    // }
}

dependencies {
    // AndroidX libraries
    implementation 'androidx.appcompat:appcompat:1.6.1' // AndroidX for AppCompat
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4' // AndroidX for ConstraintLayout
    implementation 'com.google.android.material:material:1.9.0' // Material Components

    // Optional: For Room database (AndroidX versions)
    // def room_version = "2.5.2" // or the latest version
    // implementation "androidx.room:room-runtime:$room_version"
    // annotationProcessor "androidx.room:room-compiler:$room_version"

    // Optional: For ViewModel and LiveData (Lifecycle components - AndroidX versions)
    // def lifecycle_version = "2.6.1" // or the latest version
    // implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    // implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    // annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
}

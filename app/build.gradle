apply plugin: 'com.android.application'

android {
    compileSdkVersion 27 // Keep or update as needed, for now 27 is fine for basic app
    // buildToolsVersion "27.0.3" // Optional: specify build tools version

    defaultConfig {
        applicationId "com.example.androidthings.myproject" // Consider changing this for a new app
        minSdkVersion 21 // Lowered min SDK for broader compatibility, adjust as needed
        targetSdkVersion 27
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
    // Java 8 features can be useful
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Removed Android Things dependency
    // compileOnly 'com.google.android.things:androidthings:1.0'

    // Add standard Android support libraries
    implementation 'com.android.support:appcompat-v7:27.1.1' // Or latest version
    implementation 'com.android.support.constraint:constraint-layout:1.1.3' // Or latest for ConstraintLayout

    // Optional: For Room database (add these when implementing database step)
    // def room_version = "1.1.1" // or the latest version
    // implementation "android.arch.persistence.room:runtime:$room_version"
    // annotationProcessor "android.arch.persistence.room:compiler:$room_version"

    // Optional: For ViewModel and LiveData (Lifecycle components)
    // def lifecycle_version = "1.1.1" // or the latest version
    // implementation "android.arch.lifecycle:extensions:$lifecycle_version"
    // annotationProcessor "android.arch.lifecycle:compiler:$lifecycle_version"
}
